name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode debug keystore
        run: |
          echo "${{ secrets.DEBUG_KEYSTORE }}" | base64 -d > $RUNNER_TEMP/debug.p12
          echo "DEBUG_KEYSTORE_PATH=$RUNNER_TEMP/debug.p12" >> $GITHUB_ENV
          echo "DEBUG_KEYSTORE_PASSWORD=${{ secrets.DEBUG_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Run lint
        run: ./gradlew lint

      - name: Run unit tests
        run: ./gradlew test

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Tag must match versionName
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VN=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "$TAG" != "$VN" ]; then
            echo "Tag $TAG != versionName $VN"; exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode debug keystore
        run: |
          echo "${{ secrets.DEBUG_KEYSTORE }}" | base64 -d > $RUNNER_TEMP/debug.p12
          echo "DEBUG_KEYSTORE_PATH=$RUNNER_TEMP/debug.p12" >> $GITHUB_ENV
          echo "DEBUG_KEYSTORE_PASSWORD=${{ secrets.DEBUG_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV

      - name: Decode release keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/release.jks
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV
          echo "RELEASE_KEYSTORE_PASSWORD=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}" >> $GITHUB_ENV
          echo "RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Build release AAB
        run: ./gradlew bundleRelease

      - name: Upload AAB as workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-aab
          path: app/build/outputs/bundle/release/*.aab

      - name: Stage release assets
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/
          cp app/build/outputs/apk/debug/app-debug.apk dist/
          cd dist && sha256sum app-release.apk app-debug.apk > checksums.txt

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            dist/app-release.apk
            dist/app-debug.apk
            dist/checksums.txt
          body: |
            ## Install

            Download **app-release.apk** below. This is the build to use.

            `app-debug.apk` is the development track and is signed with a different key.

            **Upgrading from a build older than v1.0.0?** You must uninstall first
            (`adb uninstall com.ksiig.tmuxmobile`) or the install fails with
            INSTALL_FAILED_UPDATE_INCOMPATIBLE. You may need to re-enter your server URL.

            Full install, verification and first-run instructions: see the README.
            Signing certificate fingerprint: see SECURITY.md.
